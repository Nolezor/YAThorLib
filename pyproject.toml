[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yathorlib"
version = "0.1.0"
description = "Yet Another Thorlabs Library: Async native APT communications for Thorlabs controllers on Linux"
requires-python = ">=3.13"
dependencies = ["pyserial>=3.5", "pyserial-asyncio>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pypdf>=5", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yathorlib = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
