[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yathorlib"
version = "0.2.0"
description = "Yet Another Thorlabs Library: Async native APT communications for Thorlabs controllers on Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nolezor"}]
keywords = ["thorlabs", "apt", "asyncio", "motion-control", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.13"
dependencies = ["pyserial>=3.5", "pyserial-asyncio>=0.6"]

[project.urls]
Repository = "https://github.com/Nolezor/YAThorLib"
Documentation = "https://github.com/Nolezor/YAThorLib/blob/main/README.md"
Issues = "https://github.com/Nolezor/YAThorLib/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pypdf>=5", "build>=1", "ruff>=0.6", "mypy>=1.10"]
release = ["build>=1", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yathorlib = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["REA Source", "docs/research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/yathorlib/__init__.py" = ["F401"]  # public re-exports
"tools/check_dist.py" = ["E731"]  # release script, left as is
